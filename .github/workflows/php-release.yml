name: PHP Version Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PHP version (e.g. 8.4.3)'
        required: true
        type: string
      force:
        description: 'Allow updating an existing release and its assets'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: 'PHP version (e.g. 8.4.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  php-version-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for existing release
        id: existing-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Manual force enabled; allowing release v$VERSION to be updated."
            exit 0
          fi

          set +e
          response=$(gh api --include "repos/$REPOSITORY/releases/tags/v$VERSION" 2>&1)
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; skipping release workflow."
          else
            if printf '%s\n' "$response" | grep -q '^HTTP/[0-9.]* 404 '; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "Failed to check release v$VERSION: $response" >&2
              exit 1
            fi
          fi

      - name: Install dependencies
        if: steps.existing-release.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Fetch PHP CLI tarballs
        if: steps.existing-release.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.event.inputs.version }}"
          echo "Fetching static-php-cli tarballs for PHP version: $VERSION"

          mkdir -p downloads
          matching_filepaths=$(mktemp)
          trap 'rm -f "$matching_filepaths"' EXIT

          # Fetch file listings using JSON API and find matching v3 artifacts
          echo "Fetching from StaticPHP v3 bulk repository..."
          curl -fsS "https://dl.static-php.dev/v3/php-bin/bulk/?format=json" | \
            jq -sr --arg version "$VERSION" 'if length == 1 and (.[0] | type == "array") then .[0][] | select(.is_dir == false and (.name | startswith("php-\($version)-cli-"))) | .full_path else error("expected one JSON array document") end' \
            >> "$matching_filepaths"

          echo "Fetching from StaticPHP v3 spc-max repository..."
          curl -fsS "https://dl.static-php.dev/v3/php-bin/spc-max/?format=json" | \
            jq -sr --arg version "$VERSION" 'if length == 1 and (.[0] | type == "array") then .[0][] | select(.is_dir == false and (.name | startswith("php-\($version)-cli-"))) | .full_path else error("expected one JSON array document") end' \
            >> "$matching_filepaths"

          if [ ! -s "$matching_filepaths" ]; then
            echo "Error: No matching StaticPHP v3 files found for version $VERSION" >&2
            exit 1
          fi

          declare -A seen_filenames=()
          expected_count=0
          while IFS= read -r filepath; do
            if [[ ! "$filepath" =~ ^/v3/php-bin/(bulk|spc-max)/php-${VERSION}-cli-[^/]+\.(tar\.gz|zip)$ ]]; then
              echo "Error: Unexpected artifact path: $filepath" >&2
              exit 1
            fi

            filename=${filepath##*/}
            if [[ "$filename" =~ ^php-${VERSION}-cli-(.+)\.tar\.gz$ ]]; then
              arch=${BASH_REMATCH[1]}
              fileext=tar.gz
            elif [[ "$filename" =~ ^php-${VERSION}-cli-(.+)\.zip$ ]]; then
              arch=${BASH_REMATCH[1]}
              fileext=zip
            else
              echo "Error: Unsupported artifact extension: $filename" >&2
              exit 1
            fi

            new_filename="php-${VERSION}-cli-${arch}.${fileext}"
            if [[ -n "${seen_filenames[$new_filename]:-}" ]]; then
              echo "Error: Duplicate final asset filename: $new_filename" >&2
              exit 1
            fi
            seen_filenames[$new_filename]=1
            expected_count=$((expected_count + 1))

            temp_file=$(mktemp)
            echo "Downloading: $filename"
            curl -fsSL -o "$temp_file" "https://dl.static-php.dev/${filepath#/}"
            if [[ "$fileext" == tar.gz ]]; then
              gzip -t "$temp_file"
              tar -xOzf "$temp_file" php > "$temp_file.member"
              if [ ! -s "$temp_file.member" ]; then
                echo "Error: Archive has no nonempty php member: $filename" >&2
                exit 1
              fi
              rm -f "$temp_file.member"
            else
              unzip -t "$temp_file" >/dev/null
              unzip -p "$temp_file" php.exe > "$temp_file.member"
              if [ ! -s "$temp_file.member" ]; then
                echo "Error: Archive has no nonempty php.exe member: $filename" >&2
                exit 1
              fi
              rm -f "$temp_file.member"
            fi
            mv "$temp_file" "downloads/$new_filename"
            echo "Validated and saved: $new_filename"
          done < "$matching_filepaths"

          shopt -s nullglob
          downloaded=(downloads/php-${VERSION}-cli-*)
          if [ "${#downloaded[@]}" -ne "$expected_count" ]; then
            echo "Error: Expected $expected_count assets, found ${#downloaded[@]}" >&2
            exit 1
          fi
          for asset in "${downloaded[@]}"; do
            if [[ -z "${seen_filenames[${asset##*/}]:-}" ]]; then
              echo "Error: Unexpected downloaded asset: ${asset##*/}" >&2
              exit 1
            fi
          done

          echo "All files in downloads directory:"
          ls -la downloads/

      - name: Extract major version
        if: steps.existing-release.outputs.exists == 'false'
        run: |
          echo "VERSION_MAJOR=$(echo ${{ inputs.version || github.event.inputs.version }} | cut -d'.' -f1,1)" >> $GITHUB_ENV

      - name: Create release with all assets
        if: steps.existing-release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: "b249226a4b2e29219091637c9658c2024e709d3a"
          tag_name: "v${{ inputs.version || github.event.inputs.version }}"
          name: "v${{ inputs.version || github.event.inputs.version }}"
          body: |
            # PHP v${{ inputs.version || github.event.inputs.version }}

            Changelog: [What's changed in v${{ inputs.version || github.event.inputs.version }}?](https://www.php.net/ChangeLog-${{ env.VERSION_MAJOR }}.php#${{ inputs.version || github.event.inputs.version }})
            
            ## Sources
            * **Official PHP**: https://php.net/releases
            * **Windows Builds**: https://windows.php.net/downloads/releases
            * **StaticPHP v3**: https://dl.static-php.dev/v3/php-bin/
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: downloads/**
          fail_on_unmatched_files: true
